# Link per-frame detections into tracks with trackpy -- its own environment.
[workspace]
name = "wavu-track-trackpy"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.24"
pandas = ">=2.0"
trackpy = ">=0.6"
tifffile = ">=2023.1"
debugpy = ">=1.8"     # lets VS Code attach to the running worker
pytest = ">=8"

[pypi-dependencies]
wavu = { path = "../..", editable = true }  # wavu-dependency

[tasks]
worker = "wavu-worker --script-dir . --handshake-file --detached"
debug = "wavu-worker --script-dir . --handshake-file --detached --debugpy 5678"
test = "pytest -q"

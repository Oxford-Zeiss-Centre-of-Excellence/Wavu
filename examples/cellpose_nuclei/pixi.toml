# Cellpose nuclei segmentation for Wavu -- its own environment, separate from
# every other script's. Heavy (PyTorch): the first start from Fiji downloads
# about 1-2 GB once.
#
# GPU pattern mirrors the org's Napari-Pixi `dl` environment: the default
# environment is CPU (plus MPS on Apple silicon, which PyTorch's macOS build
# supports out of the box); the `cuda` environment adds NVIDIA CUDA 12 on
# linux-64 / win-64 only.
#
# Fiji always starts the *default* environment. To use an NVIDIA GPU from
# Fiji, swap the `default` line in [environments] for the commented one, then
# run `pixi install` once in this folder.
[workspace]
name = "wavu-cellpose-nuclei"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
pytorch = ">=2.3"
numpy = ">=1.24,<2.3"
tifffile = ">=2023.1"
imagecodecs = ">=2024.1"
roifile = ">=2024.1"
debugpy = ">=1.8"
pytest = ">=8"

[pypi-dependencies]
# Cellpose 3 still ships the classic "nuclei" model, small enough for a CPU.
# (Cellpose 4 replaced the model zoo with the much heavier Cellpose-SAM.)
cellpose = ">=3.1,<4"
wavu = { path = "../..", editable = true }  # wavu-dependency

[feature.cuda]
platforms = ["linux-64", "win-64"]

[feature.cuda.system-requirements]
cuda = "12"

[feature.cuda.target.linux-64.dependencies]
pytorch-gpu = ">=2.3"

[feature.cuda.target.win-64.dependencies]
pytorch-gpu = ">=2.3"

[tasks]
worker = "wavu-worker --script-dir . --handshake-file --detached"
debug = "wavu-worker --script-dir . --handshake-file --detached --debugpy 5678"
# The real segmentation test (marker `cellpose`); CI runs it weekly only.
test = "pytest -q -m cellpose -rs"

[environments]
default = { solve-group = "default" }
cuda = { features = ["cuda"] }
# For an NVIDIA GPU from Fiji, use instead:
# default = { features = ["cuda"] }

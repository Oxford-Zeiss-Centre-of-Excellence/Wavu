# Segment every frame of a time-lapse (or a single image) with a classic
# threshold pipeline -- light, CPU only, its own environment.
[workspace]
name = "wavu-segment-frames"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.24"
scipy = ">=1.10"
scikit-image = ">=0.22"
pandas = ">=2.0"
tifffile = ">=2023.1"
debugpy = ">=1.8"     # lets VS Code attach to the running worker
pytest = ">=8"

[pypi-dependencies]
wavu = { path = "../..", editable = true }  # wavu-dependency

[tasks]
worker = "wavu-worker --script-dir . --handshake-file --detached"
debug = "wavu-worker --script-dir . --handshake-file --detached --debugpy 5678"
test = "pytest -q"

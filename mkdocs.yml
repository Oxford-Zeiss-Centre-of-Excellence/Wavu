# The beginner tutorial website (https://oxford-zeiss-centre-of-excellence.github.io/Wavu/).
# Sources: guide/ (English: page.md; translations: page.fr.md, page.zh-Hant.md, ...).
# Developer docs stay in docs/ and are linked from the README.
#   pixi run -e docs docs-serve   # live preview on http://127.0.0.1:8000
#   pixi run -e docs docs-build   # what CI runs (.github/workflows/docs.yml)
site_name: Wavu
site_description: Run your Python image analysis from Fiji, each script in its own environment.
site_url: https://oxford-zeiss-centre-of-excellence.github.io/Wavu/
repo_url: https://github.com/Oxford-Zeiss-Centre-of-Excellence/Wavu
repo_name: Oxford-Zeiss-Centre-of-Excellence/Wavu
edit_uri: ""
copyright: Wavu is GPL-3.0-or-later · Oxford-Zeiss Centre of Excellence

docs_dir: guide
exclude_docs: |
  TRANSLATING.md

theme:
  name: material
  language: en
  logo: assets/img/favicon.svg
  favicon: assets/img/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  # Light theme only. Colours: stylesheets/extra.css
  palette:
    scheme: default
    primary: custom
    accent: custom

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Start here: Pour commencer
            Write a script: Écrire un script
            Share: Partager
            AI agents: Agents IA
            Help: Aide
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Start here: Erste Schritte
            Write a script: Skript schreiben
            Share: Teilen
            AI agents: KI-Agenten
            Help: Hilfe
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Start here: Para empezar
            Write a script: Escribir un script
            Share: Compartir
            AI agents: Agentes de IA
            Help: Ayuda
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Start here: С чего начать
            Write a script: Написать скрипт
            Share: Поделиться
            AI agents: ИИ-агенты
            Help: Помощь
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Start here: はじめに
            Write a script: スクリプトを書く
            Share: 共有する
            AI agents: AI エージェント
            Help: ヘルプ
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            Start here: 시작하기
            Write a script: 스크립트 작성
            Share: 공유하기
            AI agents: AI 에이전트
            Help: 도움말
        - locale: zh-Hant
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            Start here: 從這裡開始
            Write a script: 撰寫腳本
            Share: 分享
            AI agents: AI 代理
            Help: 說明
        - locale: zh-Hans
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Start here: 从这里开始
            Write a script: 编写脚本
            Share: 分享
            AI agents: AI 智能体
            Help: 帮助
          theme:
            language: zh  # Material calls Simplified Chinese "zh"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Start here:
      - start/what-is-wavu.md
      - start/install.md
      - start/first-run.md
  - Write a script:
      - write/get-the-template.md
      - write/test-without-fiji.md
      - write/from-notebook.md
      - write/params.md
      - write/outputs.md
      - write/logs-progress-cancel.md
      - write/real-images.md
  - Share:
      - share/with-your-lab.md
      - share/with-the-world.md
  - AI agents: agents.md
  - Help:
      - help/troubleshooting.md
      - help/debug-in-vscode.md
      - help/glossary.md

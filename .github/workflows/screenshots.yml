name: screenshots

# STUB (TODO): regenerate the README screenshots on every release by driving
# the real Fiji GUI under Xvfb with docs/screenshots/capture.groovy. For now
# the PNGs are uploaded as a workflow artifact for a human to look at; once
# they are reliable, commit them back (or attach to the release).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.78.0
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: bash tools/get_fiji.sh .fiji
      - name: Capture under Xvfb
        env:
          WAVU_LIB: ${{ github.workspace }}/fiji/scripts/Plugins/Wavu/lib/wavu_lib.groovy.txt
          WAVU_SCRIPT_DIR: ${{ github.workspace }}/templates/wavu-script
          WAVU_SHOTS: ${{ github.workspace }}/docs/screenshots
        run: |
          pixi install --manifest-path templates/wavu-script/pixi.toml
          FIJI="$(cat .fiji/FIJI_DIR)"; L="$(cat .fiji/FIJI_LAUNCHER)"
          xvfb-run -a -s "-screen 0 1600x1000x24" "$FIJI/$L" --run docs/screenshots/capture.groovy
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png

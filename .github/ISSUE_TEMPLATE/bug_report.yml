name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which menu item, which script folder, what image (size/type)?
  - type: textarea
    id: log
    attributes:
      label: Fiji Log window output
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Wavu (Log shows it on worker start), Fiji / Java (Help > About), OS
    validations:
      required: true

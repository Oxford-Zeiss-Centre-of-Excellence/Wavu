[workspace]
name = "wavu"
description = "Run Python scripts, each in its own pixi environment, from Fiji."
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

# The development environment: wavu itself (editable) plus what the tests
# need to exercise every output kind (tables via pandas, ROI zips via roifile)
# and the template script (scipy). Script environments are separate pixi
# workspaces in their own folders -- see templates/wavu-script/pixi.toml.
[dependencies]
python = "3.12.*"
numpy = ">=1.24"
tifffile = ">=2023.1"
imagecodecs = ">=2024.1"  # decodes the BBBC039 PNG ground-truth mask
scipy = ">=1.10"
pandas = ">=2.0"
roifile = ">=2024.1"
debugpy = ">=1.8"
pytest = ">=8"
pytest-timeout = ">=2.3"

[pypi-dependencies]
wavu = { path = ".", editable = true }

[tasks]
test = "pytest -q"
# Launches real workers through `pixi run` inside the template's own env.
test-integration = "pytest -q -m pixi_env -rs"
# Headless Fiji smoke test: WAVU_FIJI=<Fiji.app> pixi run test-fiji
test-fiji = "pytest -q -m fiji -rs -s"
# Launch mode 2: a worker for the template script that Fiji can connect to.
worker = "wavu-worker --script-dir templates/wavu-script --handshake-file --detached"
# pixi run new-script my_analysis  -> ./my_analysis (copy of templates/wavu-script)
new-script = "wavu new-script"
# Verify (or re-download) the committed BBBC039 image + mask in tests/data (docs/test-data.md).
fetch-test-data = "python tools/fetch_test_data.py"
# Regenerate examples/data/demo_timelapse.tif (synthetic nuclei time-lapse, CC0; deterministic).
demo-data = "python tools/make_demo_timelapse.py"
# The Fiji client as a zip that unzips straight into Fiji.app (release asset).
fiji-zip = "python tools/make_fiji_zip.py"

[feature.build.dependencies]
python-build = ">=1.2"
hatchling = ">=1.21"
hatch-vcs = ">=0.4"

[feature.build.tasks]
build = "python -m build --outdir dist"

# The tutorial website (guide/ -> GitHub Pages; see mkdocs.yml and
# .github/workflows/docs.yml). Not needed for the tests or the worker.
[feature.docs.dependencies]
python = "3.12.*"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5"

[feature.docs.pypi-dependencies]
mkdocs-static-i18n = ">=1.2"  # not on conda-forge

[feature.docs.tasks]
docs-serve = "python tools/make_agent_files.py && mkdocs serve"
docs-build = "python tools/make_agent_files.py && mkdocs build --strict"

# wavu-napari: the napari frontend (napari/), with wavu itself editable.
# A separate solve so napari's stack never moves the default env's pins.
#   pixi run -e napari napari                    napari with Plugins > Wavu
#   pixi run -e napari test-napari               widget + conversion tests (Qt offscreen)
#   pixi run -e napari test-napari-integration   a real worker in templates/wavu-script, through pixi
[feature.napari.dependencies]
napari = "==0.7.1"
pyqt = "*"
matplotlib = ">=3.8"  # pipelines: plots docked in the viewer (examples/pipelines)
numpy = ">=1.24"
tifffile = ">=2023.1"
roifile = ">=2023.1"
pandas = ">=1.5"
scipy = ">=1.10"
pytest = ">=8"
pytest-qt = ">=4"
pytest-timeout = ">=2.3"

[feature.napari.pypi-dependencies]
wavu = { path = ".", editable = true }
wavu-napari = { path = "napari", editable = true }

[feature.napari.tasks]
napari = { cmd = "napari", description = "Launch napari with the Wavu widget" }
test-napari = { cmd = "pytest -q", cwd = "napari", env = { QT_QPA_PLATFORM = "offscreen" }, description = "wavu-napari unit + widget tests (Qt offscreen)" }
test-napari-integration = { cmd = "pytest -q -m pixi_env -rs", cwd = "napari", env = { QT_QPA_PLATFORM = "offscreen" }, description = "wavu-napari: a real worker in templates/wavu-script through pixi" }

[environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }
napari = { features = ["napari"], solve-group = "napari" }

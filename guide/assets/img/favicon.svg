<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wavu: a wooden jetty reaching out over the sea">
  <!-- Horizon at the golden section: sky 0.382 of the height, sea 0.618. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2f1"/>
      <stop offset="1" stop-color="#e6eff5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa8ad"/>
      <stop offset="1" stop-color="#2e7378"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a68c72"/>
      <stop offset="1" stop-color="#8a6a4c"/>
    </linearGradient>
    <clipPath id="badge"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="64" height="25" fill="url(#sky)"/>
    <rect y="24.5" width="64" height="39.5" fill="url(#sea)"/>
    <path d="M5 34 q4 -1.3 8 0 M49 32 q4 -1.2 8 0 M3 46 q4 -1.6 8 0 M53 44 q4 -1.6 8 0" stroke="#d6ecee" stroke-width="1" fill="none" opacity=".55"/>
    <polygon points="30.4,24.5 33.6,24.5 55,64 9,64" fill="url(#wood)"/>
    <g stroke="#5e4630" stroke-width=".9" opacity=".75">
      <line x1="28.5" y1="28.1" x2="35.5" y2="28.1"/>
      <line x1="26.3" y1="32.0" x2="37.7" y2="32.0"/>
      <line x1="23.8" y1="36.7" x2="40.2" y2="36.7"/>
      <line x1="21.0" y1="41.9" x2="43.0" y2="41.9"/>
      <line x1="17.6" y1="48.2" x2="46.4" y2="48.2"/>
      <line x1="13.5" y1="55.7" x2="50.5" y2="55.7"/>
    </g>
  </g>
</svg>

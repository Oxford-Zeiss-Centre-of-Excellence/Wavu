<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The Wavu restaurant</title>
  <desc id="d">Fiji is the waiter that takes the order and serves the plate. The worker is the kitchen that cooks your script. Every recipe has its own pantry, the pixi environment.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="300" rx="16" fill="#fafafa" stroke="#cfd8dc"/>
  <!-- Fiji / waiter -->
  <rect x="24" y="40" width="200" height="220" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="124" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">Fiji</text>
  <text x="124" y="94" text-anchor="middle" font-size="14" fill="#0d47a1">the waiter</text>
  <circle cx="124" cy="140" r="18" fill="#1565c0"/>
  <rect x="104" y="160" width="40" height="46" rx="10" fill="#1565c0"/>
  <text x="124" y="232" text-anchor="middle" font-size="13" fill="#0d47a1">dialog in,</text>
  <text x="124" y="249" text-anchor="middle" font-size="13" fill="#0d47a1">results out</text>
  <!-- arrows -->
  <line x1="232" y1="120" x2="318" y2="120" stroke="#546e7a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="275" y="110" text-anchor="middle" font-size="13" fill="#37474f">order</text>
  <line x1="318" y1="190" x2="232" y2="190" stroke="#546e7a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="275" y="212" text-anchor="middle" font-size="13" fill="#37474f">plate</text>
  <!-- worker / kitchen -->
  <rect x="326" y="40" width="370" height="220" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="511" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#1b5e20">Worker</text>
  <text x="511" y="94" text-anchor="middle" font-size="14" fill="#1b5e20">the kitchen, on your computer</text>
  <!-- recipe 1 -->
  <rect x="346" y="112" width="160" height="56" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="426" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">blur script.py</text>
  <text x="426" y="155" text-anchor="middle" font-size="12" fill="#e65100">the recipe</text>
  <rect x="346" y="180" width="160" height="56" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="426" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#4a148c">its own pantry</text>
  <text x="426" y="223" text-anchor="middle" font-size="12" fill="#4a148c">numpy, scipy</text>
  <!-- recipe 2 -->
  <rect x="518" y="112" width="160" height="56" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="598" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">cellpose script.py</text>
  <text x="598" y="155" text-anchor="middle" font-size="12" fill="#e65100">another recipe</text>
  <rect x="518" y="180" width="160" height="56" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="598" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#4a148c">its own pantry</text>
  <text x="598" y="223" text-anchor="middle" font-size="12" fill="#4a148c">pytorch, cellpose</text>
  <text x="360" y="288" text-anchor="middle" font-size="12" fill="#546e7a">Pantries are never shared, so one recipe cannot spoil another.</text>
</svg>
